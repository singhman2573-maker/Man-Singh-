<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MS Connect - VibeNet Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        /* Premium Space & Background */
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); font-family: sans-serif; padding-bottom: 80px; margin: 0; }
        .vibe-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 12px 20px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center; }
        .vibe-logo { font-size: 1.6rem; font-weight: 900; background: linear-gradient(45deg, #d2d2d7, #0084ff, #e1306c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        /* Post Card with extra spacing */
        .post-card { background: white; border-radius: 20px; margin-bottom: 25px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #eee; display: flex; justify-content: space-around; padding: 15px 0; z-index: 1000; border-radius: 25px 25px 0 0; }
        #reels-page { display: none; background: #000; height: calc(100vh - 70px); width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; }
    </style>
</head>
<body>
    <div class="vibe-header">
        <h1 class="vibe-logo">MS Connect</h1>
        <button id="login-btn" onclick="googleLogin()" class="bg-blue-600 text-white text-[11px] px-5 py-2 rounded-full font-bold shadow-lg">Sign In</button>
    </div>

    <div id="content" class="max-w-md mx-auto p-4">
        <div id="home-page">
            <div id="posts-list"><p class="text-center mt-20 text-gray-500 font-medium">Vibes are loading...</p></div>
        </div>
        <div id="reels-page">
            <div class="h-full w-full flex flex-col justify-center items-center text-white">
                <i class="fas fa-play-circle text-8xl opacity-30 mb-4"></i>
                <p class="text-xl font-bold">Trending Reels</p>
                <p class="text-sm opacity-50">Swipe up for more vibes</p>
            </div>
        </div>
    </div>

    <div class="nav-bar shadow-2xl">
        <button onclick="setView('home')"><i class="fas fa-home text-2xl text-gray-800"></i></button>
        <button onclick="alert('Search soon!')"><i class="fas fa-search text-2xl text-gray-400"></i></button>
        <button onclick="checkAndPost()"><i class="fas fa-plus-circle text-4xl text-blue-600"></i></button>
        <button onclick="setView('reels')"><i class="fas fa-video text-2xl text-gray-800"></i></button>
        <button onclick="alert('Profile Loading...')"><i class="fas fa-user-circle text-2xl text-gray-400"></i></button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDW5_kfC4EoS7AFsvNQkkmlIE_Rer03FOM",
            authDomain: "mangram-c2f6a.firebaseapp.com",
            projectId: "mangram-c2f6a",
            storageBucket: "mangram-c2f6a.firebasestorage.app",
            messagingSenderId: "949533506567",
            appId: "1:949533506567:web:5ce698bfc0394d7ef5fea2"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        let currentUser = null;

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(res => {
                currentUser = res.user;
                document.getElementById('login-btn').innerText = currentUser.displayName;
                alert("Welcome to MS Connect, " + currentUser.displayName + "!");
            });
        }

        function setView(view) {
            document.getElementById('home-page').style.display = view === 'home' ? 'block' : 'none';
            document.getElementById('reels-page').style.display = view === 'reels' ? 'block' : 'none';
            document.body.style.background = view === 'reels' ? '#000' : 'linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%)';
        }

        function checkAndPost() {
            if(!currentUser) return alert("Pehle 'Sign In' button par click karein!");
            let cap = prompt("Share your vibe:");
            if(cap) {
                db.collection("posts").add({
                    username: currentUser.displayName,
                    caption: cap,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
        }

        db.collection("posts").orderBy("timestamp", "desc").onSnapshot(snap => {
            let html = "";
            snap.forEach(doc => {
                let p = doc.data();
                html += `
                <div class="post-card">
                    <div class="p-4 font-bold border-b flex items-center">
                        <div class="w-9 h-9 bg-gradient-to-tr from-blue-500 to-pink-500 text-white rounded-full mr-3 flex items-center justify-center text-xs">MS</div>
                        ${p.username}
                    </div>
                    <img src="https://picsum.photos/500/500?random=${Math.random()}" class="w-full h-auto" loading="lazy">
                    <div class="p-4">
                        <div class="flex space-x-5 mb-3 text-2xl">
                            <i class="far fa-heart hover:text-red-500 cursor-pointer"></i>
                            <i class="far fa-comment"></i>
                            <i class="far fa-paper-plane"></i>
                        </div>
                        <p class="text-sm"><b>${p.username}</b> ${p.caption}</p>
                    </div>
                </div>`;
            });
            document.getElementById("posts-list").innerHTML = html || "<p class='text-center mt-20 text-gray-400'>Be the first to start the vibe!</p>";
        });
    </script>
</body>
</html>
